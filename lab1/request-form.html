
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Request a Tutoring Session</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<nav class="container py-3" aria-label="Main navigation">
    <a class="me-3" href="index.html">Home</a>
    <a class="me-3" href="tutors.html">View Tutors</a>
    <a href="request-form.html">Request Tutoring</a>
</nav>

<main class="container py-4">
    <h1>Request a tutoring session</h1>

    <form class="request-form"
          action="process-request.php"
          method="post">

        <div class="mb-3">
            <label class="form-label" for="course">
                Course
            </label>
            <input class="form-control"
                   type="text"
                   id="course"
                   name="course"
                   required>
        </div>

        <div class="mb-3">
            <label class="form-label" for="date">
                Preferred Date
            </label>
            <input class="form-control"
                   type="date"
                   id="date"
                   name="date"
                   required>
        </div>

        <button class="btn btn-danger" type="submit">
            Request Session
        </button>

    </form>
</main>

</body>
</html>
